[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "react-webshop-baseline"
version = "0.1.0"
description = "Planning and triggered reflection for ReAct agents on WebShop"
readme = "README.md"
keywords = ["react", "webshop", "llm-agents", "planning", "reflection", "ablation"]
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "openai>=2.0,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
]

[project.scripts]
webshop-baseline = "webshop_baseline.cli:main"

[project.urls]
Repository = "https://github.com/qihua728/react-webshop-planning-reflection"
Issues = "https://github.com/qihua728/react-webshop-planning-reflection/issues"
Documentation = "https://github.com/qihua728/react-webshop-planning-reflection/blob/main/docs/REPRODUCIBILITY.md"

[tool.setuptools.packages.find]
where = ["src"]

